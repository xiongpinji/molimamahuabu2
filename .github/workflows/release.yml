name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    name: Build signed Windows release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontweb/package-lock.json
            desktop/package-lock.json

      - name: Verify release tag matches package version
        shell: pwsh
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match desktop package version $version"
          }

      - name: Require Windows signing credentials
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            throw 'Missing repository secret WIN_CSC_LINK'
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw 'Missing repository secret WIN_CSC_KEY_PASSWORD'
          }

      - name: Verify release contract
        run: node --test backend-node/test/desktopReleaseWorkflow.test.js

      - name: Install frontend dependencies
        run: npm --prefix frontweb ci

      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Build signed Windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm --prefix desktop run dist -- --publish never --config.win.forceCodeSigning=true

      - name: Verify signatures and write checksums
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -Path desktop/release -Filter '*.exe')
          if ($artifacts.Count -ne 2) {
            throw "Expected installer and portable EXE, found $($artifacts.Count)"
          }
          if (-not ($artifacts.Name -match ' Setup\.exe$')) {
            throw 'Missing NSIS installer'
          }
          if (-not ($artifacts.Name -match ' Portable\.exe$')) {
            throw 'Missing portable executable'
          }
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature on $($artifact.Name): $($signature.Status)"
            }
          }
          $checksums = $artifacts |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash *$($_.Name)"
            }
          $checksums | Set-Content -Path desktop/release/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Attest signed executables
        uses: actions/attest@v4
        with:
          subject-path: desktop/release/*.exe

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-signed-release
          path: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS.txt
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
