name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build signed Windows release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontweb/package-lock.json
            desktop/package-lock.json

      - name: Verify release tag matches package version
        shell: pwsh
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match desktop package version $version"
          }

      - name: Require Windows signing credentials
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            throw 'Missing repository secret WIN_CSC_LINK'
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw 'Missing repository secret WIN_CSC_KEY_PASSWORD'
          }

      - name: Verify release contract
        run: node --test backend-node/test/desktopReleaseWorkflow.test.js

      - name: Install frontend dependencies
        run: npm --prefix frontweb ci

      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Build signed Windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm --prefix desktop run dist -- --publish never --config.win.forceCodeSigning=true

      - name: Verify signatures, timestamps and checksums
        shell: pwsh
        run: |
          & desktop/scripts/verify-signed-release.ps1 `
            -ReleaseDirectory desktop/release

      - name: Verify signed install, cover install, uninstall and user-data retention
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path desktop/release -Filter '* Setup.exe' |
            Select-Object -First 1
          if (-not $installer) {
            throw 'Missing NSIS installer'
          }
          & desktop/scripts/validate-windows-installer.ps1 `
            -InstallerPath $installer.FullName `
            -RequireValidSignature

      - name: Attest signed executables
        uses: actions/attest@v4
        with:
          subject-path: desktop/release/*.exe

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-signed-release
          path: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS.txt
            desktop/release/release-verification.json
          if-no-files-found: error
          retention-days: 7

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS.txt
            desktop/release/release-verification.json
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
