name: Backend Node Tests

on:
  pull_request:
    paths:
      - 'backend-node/**'
      - 'frontweb/**'
      - 'docs/verification/platform-stability/**'
      - 'deploy/release-scopes/platform-stability-foundation.json'
      - '.github/workflows/backend-node-tests.yml'

permissions:
  contents: read

concurrency:
  group: backend-node-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend-node/package-lock.json

      - name: Install ffmpeg test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install backend dependencies
        working-directory: backend-node
        run: npm ci

      - name: Run backend tests
        working-directory: backend-node
        run: npm test

      - name: Run root-owned release evidence guard tests
        working-directory: backend-node
        run: sudo "$(command -v node)" --test --test-concurrency=1 test/sharedExternalModelReleaseGuard.test.js test/lingjingSharedExternalModelReleaseGuard.test.js

      - name: Audit feature locks
        working-directory: backend-node
        run: npm run audit:feature-lock
