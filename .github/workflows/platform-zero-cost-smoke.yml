name: Platform zero-cost smoke

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-zero-cost-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Read-only browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: frontweb/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontweb
        run: npm ci

      - name: Install Chromium
        working-directory: frontweb
        run: npx playwright install --with-deps chromium

      - name: Run zero-cost smoke
        working-directory: frontweb
        env:
          PLATFORM_SMOKE_BASE_URL: ${{ secrets.PLATFORM_SMOKE_BASE_URL }}
          PLATFORM_SMOKE_EMAIL: ${{ secrets.PLATFORM_SMOKE_EMAIL }}
          PLATFORM_SMOKE_PASSWORD: ${{ secrets.PLATFORM_SMOKE_PASSWORD }}
        run: node scripts/run-platform-zero-cost-smoke.mjs

      - name: Upload sanitized smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-zero-cost-smoke-${{ github.run_id }}
          path: |
            frontweb/platform-smoke-artifacts/sanitized-*.png
            frontweb/platform-smoke-artifacts/safe-trace.json
          if-no-files-found: error
          retention-days: 7
